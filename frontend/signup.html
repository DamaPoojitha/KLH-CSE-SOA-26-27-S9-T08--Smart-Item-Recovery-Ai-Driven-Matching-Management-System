<!doctype html><html lang='en'><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>KLH Signup</title><link rel='stylesheet' href='css/style.css'/></head><body><video id='bg-video' autoplay muted loop><source src='videos/login-bg.mp4' type='video/mp4'/></video><div class='overlay'></div><div class='login-wrap'><img src='assets/klh-logo.png' class='logo sharp'/><div class='card glass'><h2>Create Account</h2><form id='signupForm'><input id='name' type='text' placeholder='Full name' required/><input id='rollno' type='text' placeholder='Roll number' required/><input id='signupEmail' type='email' placeholder='Campus Email (e.g. rollno@klh.edu.in)' required/><input id='signupPassword' type='password' placeholder='Password' required/><input id='confirmPassword' type='password' placeholder='Confirm Password' required/><button type='submit'>Sign up</button></form><p class='muted'>Already have an account? <a href='index.html'>Login</a></p></div></div><script src='js/signup.js'></script></body></html>
