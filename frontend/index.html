<!doctype html>
<html lang='en'>
<head>
    <meta charset='utf-8'/>
    <meta name='viewport' content='width=device-width,initial-scale=1'/>
    <title>KLH Login</title>
    <link rel='stylesheet' href='css/style.css'/>
</head>
<body>
    <video id='bg-video' autoplay muted loop>
        <source src='videos/login-bg.mp4' type='video/mp4'/>
    </video>
    <div class='overlay'></div>
    <div class='login-wrap'>
        <img src='assets/klh-logo.png' class='logo sharp'/>
        <div class='card glass'>
            <h2>Welcome Back</h2>
            <form id='loginForm'>
                <input id='email' type='email' placeholder='Campus Email (e.g. rollno@klh.edu.in)' required/>
                <input id='password' type='password' placeholder='Password' required/>
                <button type='submit'>Login</button>
            </form>
            <p class='muted'>Don't have an account? <a href='signup.html'>Sign up</a></p>
        </div>
    </div>
    <script src='js/login.js'></script>
</body>
</html>
